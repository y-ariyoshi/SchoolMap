<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東京都 学校マップ（国土数値情報 P29）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; color: #222; }
  body { display: flex; }
  #side { width: 300px; height: 100%; overflow-y: auto; padding: 14px; background: #f7f8fa; border-right: 1px solid #ddd; }
  #map { flex: 1; height: 100%; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: #666; margin-bottom: 12px; }
  .box { background: #fff; border: 1px solid #e2e4e8; border-radius: 8px; padding: 10px; margin-bottom: 12px; }
  .box h2 { font-size: 13px; margin: 0 0 8px; }
  input[type=text] { width: 100%; padding: 6px 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; }
  .cat { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 0; cursor: pointer; }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.35); flex-shrink: 0; }
  .cnt { margin-left: auto; color: #888; font-size: 12px; }
  .btns { display: flex; gap: 6px; margin-bottom: 6px; }
  .btns button { flex: 1; padding: 4px; font-size: 12px; border: 1px solid #bbb; background: #fff; border-radius: 5px; cursor: pointer; }
  #status { font-size: 13px; color: #333; }
  #loader { display: none; }
  #loader p { font-size: 12px; color: #a33; margin: 0 0 6px; }
  #drop { border: 2px dashed #99a; border-radius: 8px; padding: 14px; text-align: center; font-size: 12px; color: #555; }
  #drop.over { background: #eef; }
  .popup-name { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
  .popup table { font-size: 12px; border-collapse: collapse; }
  .popup td { padding: 1px 4px; vertical-align: top; }
  .popup td:first-child { color: #666; white-space: nowrap; }
  @media (max-width: 700px) {
    body { flex-direction: column; }
    #side { width: 100%; height: 42%; border-right: none; border-bottom: 1px solid #ddd; }
    #map { height: 58%; }
  }
</style>
</head>
<body>
<div id="side">
  <h1>東京都 学校マップ</h1>
  <div class="sub">国土数値情報 学校データ（P29-23_13.geojson）</div>

  <div class="box" id="loader">
    <p>GeoJSONを自動で読み込めませんでした。<br>ファイルを選択するか、ここにドラッグしてください。</p>
    <div id="drop">P29-23_13.geojson をドロップ<br><br><input type="file" id="file" accept=".geojson,.json"></div>
  </div>

  <div class="box">
    <h2>名称で検索</h2>
    <input type="text" id="search" placeholder="例：中央区立、早稲田">
  </div>

  <div class="box">
    <h2>学校分類</h2>
    <div class="btns"><button id="allOn">すべて表示</button><button id="allOff">すべて非表示</button></div>
    <div id="cats"></div>
  </div>

  <div class="box"><div id="status">読み込み中…</div></div>
</div>
<div id="map"></div>

<script>
const GEOJSON_FILE = 'P29-23_13.geojson';

// P29_003 学校分類コード
const CATEGORIES = {
  '16001': { name: '小学校',               color: '#1f77b4' },
  '16002': { name: '中学校',               color: '#2ca02c' },
  '16003': { name: '中等教育学校',         color: '#17becf' },
  '16004': { name: '高等学校',             color: '#ff7f0e' },
  '16005': { name: '高等専門学校',         color: '#8c564b' },
  '16006': { name: '短期大学',             color: '#e377c2' },
  '16007': { name: '大学',                 color: '#d62728' },
  '16011': { name: '幼稚園',               color: '#f2c40f' },
  '16012': { name: '特別支援学校',         color: '#9467bd' },
  '16013': { name: '幼保連携型認定こども園', color: '#bcbd22' },
  '16014': { name: '義務教育学校',         color: '#00897b' },
  '16015': { name: '各種学校',             color: '#7f7f7f' },
  '16016': { name: '専修学校',             color: '#3949ab' }
};
// P29_006 設置者（※データからの推定）
const OWNERS = { '0': 'その他（独立行政法人等）', '1': '国立', '2': '都立', '3': '区市町村立', '4': '私立' };

const map = L.map('map', { preferCanvas: true }).setView([35.69, 139.55], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors | 学校データ：国土数値情報（国土交通省）'
}).addTo(map);

let markers = [];          // { marker, code, name }
const visible = {};        // code -> boolean
Object.keys(CATEGORIES).forEach(c => visible[c] = true);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch]));
}

function popupHtml(p) {
  const cat = CATEGORIES[p.P29_003];
  const rows = [
    ['学校分類', cat ? cat.name : p.P29_003],
    ['設置者', OWNERS[p.P29_006] || p.P29_006],
    ['所在地', p.P29_005],
    ['キャンパス', p.P29_009],
    ['学校コード', p.P29_002],
    ['行政区域', p.P29_001]
  ].filter(r => r[1]);
  return `<div class="popup"><div class="popup-name">${esc(p.P29_004)}</div><table>` +
    rows.map(r => `<tr><td>${r[0]}</td><td>${esc(r[1])}</td></tr>`).join('') + '</table></div>';
}

function buildMap(geojson) {
  markers.forEach(m => map.removeLayer(m.marker));
  markers = [];
  const counts = {};
  (geojson.features || []).forEach(f => {
    if (!f.geometry || f.geometry.type !== 'Point') return;
    const p = f.properties || {};
    const [lng, lat] = f.geometry.coordinates;
    const cat = CATEGORIES[p.P29_003] || { color: '#000' };
    const marker = L.circleMarker([lat, lng], {
      radius: 5, color: '#333', weight: 0.6, fillColor: cat.color, fillOpacity: 0.85
    }).bindPopup(popupHtml(p)).bindTooltip(esc(p.P29_004));
    markers.push({ marker, code: p.P29_003, name: p.P29_004 || '' });
    counts[p.P29_003] = (counts[p.P29_003] || 0) + 1;
  });
  buildLegend(counts);
  applyFilter();
  document.getElementById('loader').style.display = 'none';
}

function buildLegend(counts) {
  const box = document.getElementById('cats');
  box.innerHTML = '';
  Object.entries(CATEGORIES).forEach(([code, c]) => {
    const label = document.createElement('label');
    label.className = 'cat';
    label.innerHTML = `<input type="checkbox" data-code="${code}" ${visible[code] ? 'checked' : ''}>` +
      `<span class="dot" style="background:${c.color}"></span>${c.name}<span class="cnt">${counts[code] || 0}</span>`;
    box.appendChild(label);
  });
  box.querySelectorAll('input').forEach(cb => cb.addEventListener('change', e => {
    visible[e.target.dataset.code] = e.target.checked;
    applyFilter();
  }));
}

function applyFilter() {
  const q = document.getElementById('search').value.trim();
  let shown = 0;
  markers.forEach(m => {
    const ok = visible[m.code] !== false && (!q || m.name.includes(q));
    if (ok) { if (!map.hasLayer(m.marker)) m.marker.addTo(map); shown++; }
    else if (map.hasLayer(m.marker)) map.removeLayer(m.marker);
  });
  document.getElementById('status').textContent = `表示中：${shown.toLocaleString()} / ${markers.length.toLocaleString()} 件`;
}

function setAll(flag) {
  Object.keys(visible).forEach(c => visible[c] = flag);
  document.querySelectorAll('#cats input').forEach(cb => cb.checked = flag);
  applyFilter();
}
document.getElementById('allOn').onclick = () => setAll(true);
document.getElementById('allOff').onclick = () => setAll(false);
document.getElementById('search').addEventListener('input', applyFilter);

// ---- 読み込み：同じフォルダから自動 → 失敗時はファイル選択／ドロップ ----
function readFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try { buildMap(JSON.parse(reader.result)); }
    catch (e) { alert('GeoJSONの読み込みに失敗しました：' + e.message); }
  };
  reader.readAsText(file, 'UTF-8');
}
document.getElementById('file').addEventListener('change', e => e.target.files[0] && readFile(e.target.files[0]));
const drop = document.getElementById('drop');
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
});

fetch(GEOJSON_FILE)
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(buildMap)
  .catch(err => {
    console.warn('自動読み込み失敗（file:// で開いた場合は通常の動作です）:', err);
    document.getElementById('loader').style.display = 'block';
    document.getElementById('status').textContent = 'データ未読み込み';
  });
</script>
</body>
</html>
